<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GhostTown</title>
  <meta name="description" content="A spooky two-player co-op platformer: Andy and his ghost. Play online across two laptops or together on one.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&family=Tinos:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20261031m">
</head>
<body>
  <!-- Title screen: the GhostTown key art -->
  <section id="title">
    <img class="title-art" src="assets/title.jpg" alt="GhostTown: Andy and his ghost in the haunted ruins">
    <button id="play-game" class="cta yellow play-game">Play Game</button>
  </section>

  <!-- Lobby: choose a hero and how to play -->
  <section id="lobby" hidden>
    <canvas id="bg" aria-hidden="true"></canvas>
    <div class="panel">
      <div class="col left">
        <div class="chip">Choose your hero</div>
        <div class="pick">
          <button class="char boy selected" data-role="boy"><canvas width="240" height="208"></canvas><span>Andy</span><small>loves candy</small></button>
          <button class="char ghost" data-role="ghost"><canvas width="240" height="208"></canvas><span>His Ghost</span><small>loves pumpkins</small></button>
        </div>
      </div>
      <div class="col right">
        <button id="create" class="cta yellow">Create room</button>
        <div class="divider"><span>or</span></div>
        <button id="local" class="cta purple">Single Screen</button>
        <div class="divider wide"><span>or join a friend</span></div>
        <div class="join">
          <input id="code" maxlength="4" placeholder="CODE" autocomplete="off" spellcheck="false">
          <button id="join" class="cta ghostbtn">Join</button>
        </div>
        <p id="lobby-err" class="err"></p>
      </div>
    </div>
  </section>

  <!-- Game -->
  <section id="game" hidden>
    <div class="side left"></div>

    <div class="stage">
      <canvas id="cv" width="816" height="600"></canvas>
      <div id="share" class="share" hidden></div>
      <div id="pause-menu" class="pause-menu" hidden>
        <div class="pause-card">
          <div class="chip">Paused</div>
          <p id="pause-note" class="pause-note"></p>
          <button id="resume" class="cta orange">Resume</button>
          <button id="restart" class="cta blue">Restart level</button>
          <button id="quit" class="cta ghostbtn wide">Main menu</button>
        </div>
      </div>
      <div id="help" class="pause-menu" hidden>
        <div class="pause-card help-card">
          <div class="chip"><span id="hud-level">Level 1</span></div>
          <div class="treats">
            <span class="pick-count candy" title="Candy"><img src="assets/wrapped.png" alt=""><b id="hud-candy">0/0</b></span>
            <span class="pick-count pumpkin" title="Pumpkins"><img src="assets/pumpkin.png" alt=""><b id="hud-pumpkin">0/0</b></span>
          </div>
          <div class="online">
            <span id="hud-room" class="room">Room <b id="hud-code">----</b></span>
            <span id="hud-role" class="tag"></span>
            <span id="hud-partner" class="partner"></span>
            <span id="hud-ping" class="ping"></span>
          </div>
          <div id="keys" class="keys"></div>
          <ul class="rules">
            <li>Andy is safe in <b class="t-lava">lava</b>, His Ghost in the <b class="t-void">black hole</b>. Green brew hurts both.</li>
            <li>Andy grabs candy, His Ghost grabs pumpkins.</li>
            <li>Buttons open the gate, the lever raises the swing.</li>
            <li>Both reach your own door to win.</li>
          </ul>
          <button id="help-close" class="cta orange">Got it</button>
        </div>
      </div>
    </div>

    <!-- minimal toolbar: time, pause, music, instructions -->
    <div class="side right">
      <div class="toolbar">
        <div class="mini-time" id="hud-time" hidden>0:00</div>
        <button id="pause" class="tool" title="Pause (Esc)">❚❚</button>
        <button id="music" class="tool" title="Music (M)">♪</button>
        <button id="help-btn" class="tool" title="Instructions (H)">?</button>
        <button id="fs-btn" class="tool" title="Full screen (F)" aria-label="Full screen">
          <svg class="fs-in" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
          <svg class="fs-out" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
        </button>
      </div>
    </div>
  </section>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="shared/game.js?v=20261031m"></script>
  <script src="audio.js?v=20261031m"></script>
  <script src="render.js?v=20261031m"></script>
  <script src="client.js?v=20261031m"></script>
</body>
</html>
