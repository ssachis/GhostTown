<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GhostTown</title>
  <meta name="description" content="A spooky two-player co-op platformer: Andy and his ghost. Play online across two laptops or together on one.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Lobby: full-screen title screen over the painted night sky -->
  <section id="lobby">
    <canvas id="bg" aria-hidden="true"></canvas>
    <div class="panel">
      <div class="col left">
      <h1>Gh<svg class="o" viewBox="0 0 24 26" aria-hidden="true"><path d="M2 12a10 10 0 0 1 20 0v12l-3.3-2.5L15.3 24 12 21.5 8.7 24l-3.4-2.5L2 24z" fill="#fff"/><ellipse cx="8.6" cy="11" rx="1.6" ry="2.2" fill="#1e1430"/><ellipse cx="15.4" cy="11" rx="1.6" ry="2.2" fill="#1e1430"/><path d="M10 15.5q2 2.6 4 0z" fill="#1e1430"/></svg>st<span>Town</span></h1>
        <p class="sub">Andy, his ghost, and one very haunted temple</p>
        <div class="chip">Choose your hero</div>
        <div class="pick">
          <button class="char boy selected" data-role="boy"><canvas width="240" height="208"></canvas><span>Andy</span><small>loves candy</small></button>
          <button class="char ghost" data-role="ghost"><canvas width="240" height="208"></canvas><span>His Ghost</span><small>loves pumpkins</small></button>
        </div>
      </div>
      <div class="col right">
        <button id="create" class="cta orange">Create room</button>
        <div class="divider"><span>or</span></div>
        <button id="local" class="cta blue">Play on one screen</button>
        <div class="divider wide"><span>or join a friend</span></div>
        <div class="join">
          <input id="code" maxlength="4" placeholder="CODE" autocomplete="off" spellcheck="false">
          <button id="join" class="cta ghostbtn">Join</button>
        </div>
        <p id="lobby-err" class="err"></p>
      </div>
    </div>
  </section>

  <!-- Game -->
  <section id="game" hidden>
    <!-- left: level, timer, treats, online status -->
    <aside class="side left">
      <div class="side-card">
        <span id="hud-level" class="level-chip">Level 1</span>
        <div class="timer"><span id="hud-time">0:00</span></div>
        <div class="treats">
          <span class="pick-count candy" title="Candy"><img src="assets/wrapped.png" alt=""><b id="hud-candy">0/0</b></span>
          <span class="pick-count pumpkin" title="Pumpkins"><img src="assets/pumpkin.png" alt=""><b id="hud-pumpkin">0/0</b></span>
        </div>
        <div class="online">
          <span id="hud-room" class="room">Room <b id="hud-code">----</b></span>
          <span id="hud-role" class="tag"></span>
          <span id="hud-partner" class="partner"></span>
          <span id="hud-ping" class="ping"></span>
        </div>
      </div>
    </aside>

    <div class="stage">
      <canvas id="cv" width="816" height="600"></canvas>
      <div id="share" class="share" hidden></div>
      <div id="pause-menu" class="pause-menu" hidden>
        <div class="pause-card">
          <div class="chip">Paused</div>
          <p id="pause-note" class="pause-note"></p>
          <button id="resume" class="cta orange">Resume</button>
          <button id="restart" class="cta blue">Restart level</button>
          <button id="quit" class="cta ghostbtn wide">Main menu</button>
        </div>
      </div>
    </div>

    <!-- right: pause, music, controls -->
    <aside class="side right">
      <div class="side-card">
        <button id="pause" class="side-btn" title="Pause (Esc)"><span class="ico">❚❚</span>Pause</button>
        <button id="music" class="side-btn" title="Music (M)"><span class="ico">♪</span>Music</button>
        <div id="keys" class="keys"></div>
      </div>
    </aside>
  </section>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="shared/game.js"></script>
  <script src="audio.js"></script>
  <script src="render.js"></script>
  <script src="client.js"></script>
</body>
</html>
